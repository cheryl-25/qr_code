<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">


  
  <title>Frontend Mentor | QR code component</title>

  
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    .body { background-color: #D5E1EF }
    .p {color:#1F314F;
        font-family: 'Outfit Bold', sans-serif;
        text-align: center;
       }
    .p1 {color:#68778D;
         font-family: 'Outfit Regular', sans-serif ;
         text-align: center;
        }
        .card { display: flex;
                justify-content: center;
                align-items: center;
                height: 90vh; }
    .section1 {  border: 1px solid black;
                width: 400px;
                max-width: 90%;
                padding: 16px;
                border-radius: 20px;
               text-align: center;
                 background-color: hsl(0, 0%, 100%); }
                
      .img {
        width: 100%;
        height: auto;
        border-radius: 10px;
      }
                 
                 
  </style>
</head>
<body class="body">
  <div class="card">
    <div class="section1">
      <img  class="img" src="images/image-qr-code.png" alt="qrcode" width="500" height="400">
    <p class="p">Improve your front-end skills by building projects.</p>

       <p class="p1">Scan the QR code to visit Frontend Mentor and take your coding skills to the next level.</p>
   </div>
</div>
  



 
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/cheryl-25">Cheryl Achieng</a>.
  </footer>
</body>
</html>
